<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Film Developer: Finishing</title>
<style>
  :root {
    --surround: #2a2a2a;      /* neutral ~18% grey surround, like a grading suite */
    --panel: #333333;
    --line: #444444;
    --text: #ececec;
    --muted: #a3a3a3;
    --safelight: #e0a33a;     /* darkroom safelight amber: selection + save only */
    --frame: #161616;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--surround); color: var(--text);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr auto auto; height: 100vh; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: 0.01em; }
  header .photo-nav { margin-left: auto; display: flex; align-items: center; gap: 8px; color: var(--muted); }
  button { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  button:hover { border-color: #5a5a5a; }
  button:focus-visible, input:focus-visible, .frame:focus-visible { outline: 2px solid var(--safelight); outline-offset: 2px; }
  button.primary { background: var(--safelight); color: #1d1405; border-color: var(--safelight); font-weight: 600; }
  button[disabled] { opacity: 0.5; cursor: default; }

  .stage { display: flex; align-items: center; justify-content: center; min-height: 0; padding: 4px 16px 12px; position: relative; }
  #view { max-width: 100%; max-height: 100%; box-shadow: 0 0 0 1px #3a3a3a; background: #000; }
  .badge { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.65);
    padding: 3px 10px; border-radius: 4px; font-size: 12px; color: #fff; display: none; }
  .badge.on { display: block; }

  /* the film strip of looks: the one decorative element, and it is functional */
  .strip { background: var(--frame); padding: 14px 0 12px; overflow-x: auto; white-space: nowrap; position: relative;
    background-image:
      repeating-linear-gradient(90deg, transparent 0 10px, #3b3b3b 10px 18px, transparent 18px 26px),
      repeating-linear-gradient(90deg, transparent 0 10px, #3b3b3b 10px 18px, transparent 18px 26px);
    background-size: 100% 6px, 100% 6px; background-position: 0 4px, 0 calc(100% - 4px); background-repeat: repeat-x; }
  .frames { display: inline-flex; gap: 10px; padding: 0 16px; }
  .frame { display: inline-flex; flex-direction: column; gap: 6px; width: 132px; cursor: pointer; border-radius: 3px; padding: 4px;
    border: 1px solid transparent; }
  .frame canvas { width: 124px; height: 84px; object-fit: cover; display: block; border-radius: 2px; background: #000; }
  .frame span { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .frame[aria-checked="true"] { border-color: var(--safelight); }
  .frame[aria-checked="true"] span { color: var(--safelight); }

  .controls { display: grid; grid-template-columns: minmax(220px, 1.4fr) repeat(5, minmax(110px, 1fr)) auto; gap: 18px; align-items: end;
    padding: 12px 16px 14px; background: var(--panel); border-top: 1px solid var(--line); }
  .ctl label { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; margin-bottom: 4px; }
  .ctl output { color: var(--text); font-variant-numeric: tabular-nums; }
  .ctl.strength label { color: var(--text); font-size: 13px; }
  input[type=range] { width: 100%; accent-color: #cfcfcf; }
  #strength { accent-color: var(--safelight); }
  .actions { display: flex; gap: 8px; }
  .toast { position: fixed; bottom: 92px; left: 50%; transform: translateX(-50%); background: #111; border: 1px solid var(--line);
    padding: 8px 14px; border-radius: 6px; display: none; }
  .toast.on { display: block; }
  @media (max-width: 900px) { .controls { grid-template-columns: 1fr 1fr; } .actions { grid-column: 1 / -1; } }
  @media (prefers-reduced-motion: no-preference) { .frame { transition: border-color 120ms; } }
</style>
</head>
<body>
<header>
  <h1>Finishing</h1>
  <span id="photoName" style="color:var(--muted)"></span>
  <div class="photo-nav" id="photoNav" hidden>
    <button id="prev" aria-label="Previous photo">‹</button>
    <span id="photoCount"></span>
    <button id="next" aria-label="Next photo">›</button>
  </div>
</header>

<div class="stage">
  <canvas id="view" aria-label="Preview of the photo with the selected look"></canvas>
  <div class="badge" id="beforeBadge">Before</div>
</div>

<div class="strip" role="radiogroup" aria-label="Looks"><div class="frames" id="frames"></div></div>

<div class="controls">
  <div class="ctl strength"><label for="strength">Strength <output id="o_strength">100%</output></label>
    <input id="strength" type="range" min="0" max="150" value="100"></div>
  <div class="ctl"><label for="warmth">Warmth <output id="o_warmth">0</output></label>
    <input id="warmth" type="range" min="-20" max="20" value="0" step="0.5"></div>
  <div class="ctl"><label for="tint">Tint <output id="o_tint">0</output></label>
    <input id="tint" type="range" min="-20" max="20" value="0" step="0.5"></div>
  <div class="ctl"><label for="saturation">Saturation <output id="o_saturation">0</output></label>
    <input id="saturation" type="range" min="-100" max="100" value="0"></div>
  <div class="ctl"><label for="contrast">Contrast <output id="o_contrast">0</output></label>
    <input id="contrast" type="range" min="-50" max="50" value="0"></div>
  <div class="ctl"><label for="fade">Fade <output id="o_fade">0</output></label>
    <input id="fade" type="range" min="0" max="15" value="0" step="0.5"></div>
  <div class="actions">
    <button id="compare" title="Hold to see the photo without the look (or hold \)">Hold for before</button>
    <button id="reset">Reset</button>
    <button id="save" class="primary">Save graded copy</button>
    <button id="done">Done</button>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const VS = `attribute vec2 p; varying vec2 uv; void main(){ uv = vec2((p.x+1.)*.5, (1.-p.y)*.5); gl_Position = vec4(p,0.,1.); }`;
// Must match looks.apply_look() exactly.
const FS = `precision highp float;
varying vec2 uv; uniform sampler2D img;
uniform vec3 sh, mid, hi, uw, ut;
uniform float s, sat, con, fad, warmth, tint, usat, ucon, ufade, before;
const vec3 L = vec3(0.2126, 0.7152, 0.0722);
void main(){
  vec3 x = texture2D(img, uv).rgb;
  if (before > 0.5) { gl_FragColor = vec4(x, 1.); return; }
  float Y = dot(x, L);
  float ws = pow(clamp(1. - 2.*Y, 0., 1.), 2.);
  float wh = pow(clamp(2.*Y - 1., 0., 1.), 2.);
  float wm = 1. - ws - wh;
  x = x + s*(ws*sh + wm*mid + wh*hi) + warmth*uw + tint*ut;
  Y = dot(x, L);
  x = Y + (x - Y) * (1. + s*(sat - 1.) + usat);
  float k = s*(con - 1.) + ucon;
  x = x + k*(x - .5)*4.*x*(1. - x);
  float f = s*fad + ufade;
  x = f + x*(1. - f);
  gl_FragColor = vec4(clamp(x, 0., 1.), 1.);
}`;

const state = { photos: [], index: 0, lib: null, preset: "none", strength: 1, warmth: 0, tint: 0, saturation: 0, contrast: 0, fade: 0, before: false };
const $ = id => document.getElementById(id);

function makeGL(canvas) {
  const gl = canvas.getContext("webgl", { preserveDrawingBuffer: true, premultipliedAlpha: false, antialias: false });
  const sh = (t, src) => { const o = gl.createShader(t); gl.shaderSource(o, src); gl.compileShader(o);
    if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(o)); return o; };
  const prog = gl.createProgram(); gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog); gl.useProgram(prog);
  const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, "p"); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.pixelStorei(gl.UNPACK_COLORSPACE_CONVERSION_WEBGL, gl.NONE);   // use the file's sRGB values as-is
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
  for (const [k, v] of [[gl.TEXTURE_MIN_FILTER, gl.LINEAR], [gl.TEXTURE_MAG_FILTER, gl.LINEAR], [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE]])
    gl.texParameteri(gl.TEXTURE_2D, k, v);
  const u = n => gl.getUniformLocation(prog, n);
  return { gl, canvas, u };
}

function setImage(ctx, img) {
  const { gl } = ctx; gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, img);
}

function draw(ctx, preset, p) {
  const { gl, canvas, u } = ctx;
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.uniform3fv(u("sh"), preset.sh); gl.uniform3fv(u("mid"), preset.mid); gl.uniform3fv(u("hi"), preset.hi);
  gl.uniform3fv(u("uw"), state.lib.unit_warmth); gl.uniform3fv(u("ut"), state.lib.unit_tint);
  gl.uniform1f(u("s"), p.strength); gl.uniform1f(u("sat"), preset.sat); gl.uniform1f(u("con"), preset.contrast); gl.uniform1f(u("fad"), preset.fade);
  gl.uniform1f(u("warmth"), p.warmth); gl.uniform1f(u("tint"), p.tint);
  gl.uniform1f(u("usat"), p.saturation); gl.uniform1f(u("ucon"), p.contrast); gl.uniform1f(u("ufade"), p.fade);
  gl.uniform1f(u("before"), p.before ? 1 : 0);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

let view, thumbCtx, currentImg;
const presetById = id => state.lib.presets.find(p => p.id === id);
const params = () => ({ strength: state.strength, warmth: state.warmth, tint: state.tint, saturation: state.saturation,
                        contrast: state.contrast, fade: state.fade, before: state.before });

function render() { if (currentImg) draw(view, presetById(state.preset), params()); }

function renderThumbs() {
  const c = thumbCtx.canvas;
  for (const p of state.lib.presets) {
    draw(thumbCtx, p, { strength: 1, warmth: 0, tint: 0, saturation: 0, contrast: 0, fade: 0, before: false });
    const t = document.querySelector(`.frame[data-id="${p.id}"] canvas`);
    t.width = c.width; t.height = c.height; t.getContext("2d").drawImage(c, 0, 0);
  }
}

function buildStrip() {
  const host = $("frames"); host.innerHTML = "";
  for (const p of state.lib.presets) {
    const f = document.createElement("div");
    f.className = "frame"; f.dataset.id = p.id; f.setAttribute("role", "radio"); f.tabIndex = 0;
    f.setAttribute("aria-checked", p.id === state.preset);
    f.innerHTML = `<canvas width="124" height="84"></canvas><span>${p.name}</span>`;
    f.onclick = () => choose(p.id);
    f.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); choose(p.id); } };
    host.appendChild(f);
  }
}

function choose(id) {
  state.preset = id;
  document.querySelectorAll(".frame").forEach(f => f.setAttribute("aria-checked", f.dataset.id === id));
  render();
}

async function loadPhoto(i) {
  state.index = i;
  const ph = state.photos[i];
  $("photoName").textContent = ph.name;
  $("photoCount").textContent = `${i + 1} of ${state.photos.length}`;
  const img = new Image();
  img.src = `/preview/${i}.png`;
  await img.decode();
  currentImg = img;
  view.canvas.width = img.naturalWidth; view.canvas.height = img.naturalHeight;
  setImage(view, img);
  const tw = 248, th = Math.round(tw * img.naturalHeight / img.naturalWidth);
  thumbCtx.canvas.width = tw; thumbCtx.canvas.height = th;
  setImage(thumbCtx, img);
  render(); renderThumbs();
}

function bindSlider(id, scale, fmt) {
  const el = $(id), out = $("o_" + id);
  const update = () => { state[id] = Number(el.value) * scale; out.textContent = fmt(Number(el.value)); render(); };
  el.addEventListener("input", update);
  return () => { el.value = el.defaultValue; update(); };
}

function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("on"), 3500); }

async function main() {
  view = makeGL($("view"));
  thumbCtx = makeGL(document.createElement("canvas"));
  [state.photos, state.lib] = await Promise.all([fetch("/api/photos").then(r => r.json()), fetch("/api/looks").then(r => r.json())]);
  buildStrip();
  const signed = v => (v > 0 ? "+" : "") + v;
  const resets = [bindSlider("strength", 0.01, v => v + "%"), bindSlider("warmth", 1, signed), bindSlider("tint", 1, signed),
                  bindSlider("saturation", 0.01, signed), bindSlider("contrast", 0.01, signed), bindSlider("fade", 0.01, v => v)];
  $("reset").onclick = () => { resets.forEach(r => r()); choose("none"); };
  const hold = on => { state.before = on; $("beforeBadge").classList.toggle("on", on); render(); };
  $("compare").addEventListener("pointerdown", () => hold(true));
  ["pointerup", "pointerleave"].forEach(e => $("compare").addEventListener(e, () => hold(false)));
  addEventListener("keydown", e => { if (e.key === "\\" && !e.repeat) hold(true); });
  addEventListener("keyup", e => { if (e.key === "\\") hold(false); });
  if (state.photos.length > 1) {
    $("photoNav").hidden = false;
    $("prev").onclick = () => loadPhoto((state.index - 1 + state.photos.length) % state.photos.length);
    $("next").onclick = () => loadPhoto((state.index + 1) % state.photos.length);
  }
  $("save").onclick = async () => {
    const b = $("save"); b.disabled = true; b.textContent = "Saving…";
    try {
      const r = await fetch("/api/save", { method: "POST", body: JSON.stringify({ index: state.index, preset: state.preset, ...params() }) }).then(r => r.json());
      toast(r.error ? `Couldn't save: ${r.error}` : `Saved ${r.saved}`);
    } finally { b.disabled = false; b.textContent = "Save graded copy"; }
  };
  $("done").onclick = async () => { await fetch("/api/done", { method: "POST", body: "{}" }); document.body.innerHTML = '<p style="padding:24px">Finished. You can close this tab.</p>'; };
  setInterval(() => fetch("/api/ping").catch(() => {}), 15000);
  await loadPhoto(0);
  window.__fd = { state, render, choose, view };     // used by the automated check
}
main().catch(e => { document.body.innerHTML = `<p style="padding:24px">The preview couldn't start: ${e.message}</p>`; });
</script>
</body>
</html>
